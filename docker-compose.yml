version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:RELEASE.2024-06-13T22-50-43Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: |
      set -e
      until (/usr/bin/mc alias set local http://minio:9000 minio minio12345) do echo '...waiting for minio...' && sleep 2; done;
      /usr/bin/mc mb -p local/videos || true;
      /usr/bin/mc policy set public local/videos;
      # Create prefixes
      /usr/bin/mc cp /dev/null local/videos/.keep || true;
      echo "MinIO is initialized"

volumes:
  pgdata:
  minio-data:
